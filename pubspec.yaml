name: audiobookshelf_flutter
description: "Flutter based client for Audiobookshelf"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  http: ^1.5.0
  dio: ^5.7.0
  isar_community: ^3.1.0+1
  isar_community_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  socket_io_client: ^3.1.2
  just_audio_background: ^0.0.1-beta.17
  text_scroll: ^0.2.1
  flutter_spinkit: ^5.2.2
  loading_btn: ^1.0.3
  permission_handler: ^12.0.1
  path: ^1.9.0
  mime: ^2.0.0
  # PDF and EPUB readers
  pdfrx: ^2.1.25
  archive: ^4.0.7
  xml: ^6.5.0
  flutter_html: ^3.0.0-beta.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^2.5.7
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.1
  # custom_lint: ^0.6.4 # Commented out due to analyzer conflict with isar_community_generator
  # riverpod_lint: ^2.3.9 # Commented out due to analyzer conflict with isar_generator
  json_serializable: ^6.8.0
  isar_community_generator: ^3.1.0+1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
